services:

  ebay-server:
    container_name: ebay-server
    build:
      context: .
      dockerfile: Dockerfile-store
    ports:
      - "8300:9991"
    environment:
      - STORE_NAME=ebay
      - PRICE_UPDATE_INTERVAL_MINUTES=5
    networks:
      - store_exercise_1

  amazon-server:
    container_name: amazon-server
    build:
      context: .
      dockerfile: Dockerfile-store
    ports:
      - "8301:9991"
    environment:
      - STORE_NAME=amazon
      - PRICE_UPDATE_INTERVAL_MINUTES=5
    networks:
      - store_exercise_1

  mysql_db:
    container_name: mysql_db_1
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: abcdef123
      MYSQL_DATABASE: app_db # Default database created at startup
      MYSQL_USER: dev
      MYSQL_PASSWORD: abcdef123
    volumes:
      - mysql_db_storage:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "dev", "-pabcdef123"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "33063:3306"
    networks:
      - store_exercise_1
  backend-server:
    container_name: price-comparison-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:9991"
    environment:
      - DATABASE_URL=mysql+asyncmy://dev:abcdef123@mysql_db:3306/app_db
    depends_on:
      mysql_db:
        condition: service_healthy
      ebay-server:
        condition: service_started
      amazon-server:
        condition: service_started
    networks:
      - store_exercise_1
  frontend:
    container_name: price-comparison-ui
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-server
    networks:
      - store_exercise_1

networks:
  store_exercise_1:
    driver: bridge


volumes:
  mysql_db_storage:
    driver: local
